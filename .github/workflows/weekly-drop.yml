name: Weekly drop

# Sends this week's introductions. 14:30 UTC on Sunday is 20:00 in India.
# GitHub may start scheduled runs a few minutes late. Running it twice in one
# week is harmless: the second call changes nothing.
on:
  schedule:
    - cron: "30 14 * * 0"
  workflow_dispatch:

jobs:
  drop:
    runs-on: ubuntu-latest
    steps:
      - name: Call the drop endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/drop"
