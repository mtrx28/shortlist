name: Expire chats

# Ends chats whose 72 hour window is over and updates reply rates. Runs at
# minute 7 of every hour. GitHub may start scheduled runs a few minutes late.
# Running it twice is harmless: the second call finds nothing left to end.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Call the expire endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error title=APP_URL is not set::Add the APP_URL repository secret (the deployed address, for example https://your-app.vercel.app). See docs/deploy.md, step 6."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=CRON_SECRET is not set::Add the CRON_SECRET repository secret (the same value as CRON_SECRET in the app's environment). See docs/deploy.md, step 6."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/expire"
