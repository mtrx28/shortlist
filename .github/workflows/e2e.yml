name: End-to-end tests

# Runs the integration tests and the browser tests against a real local
# Supabase stack (database, auth, storage, realtime, mail catcher) started on
# the runner. It is slower than the normal CI, so it runs only when asked
# (Actions tab > Run workflow) and on pull requests to main, not on every push.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_CLI: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts the stack, rebuilds its database from the migrations, builds and
      # starts the app, runs both suites, and stops everything.
      - run: npm run test:all
      - name: Keep the Playwright report and traces when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
