name: Keep alive

# A free Supabase project pauses after about a week without activity. This
# pings the app every three days: /api/health (the app is up) and
# /api/cron/keepalive (one tiny database query, so the database counts as used).
on:
  schedule:
    - cron: "15 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app and the database
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error title=APP_URL is not set::Add the APP_URL repository secret (the deployed address, for example https://your-app.vercel.app). See docs/deploy.md, step 6."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=CRON_SECRET is not set::Add the CRON_SECRET repository secret (the same value as CRON_SECRET in the app's environment). See docs/deploy.md, step 6."
            exit 1
          fi
          base="${APP_URL%/}"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            "$base/api/health"
          echo
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$base/api/cron/keepalive"
