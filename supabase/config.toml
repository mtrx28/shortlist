# Local Supabase settings. Written by hand (the CLI was not needed to create it).
# Run `npx supabase start` (needs Docker) to boot a local database using this file.
# Only the options I change from the defaults are listed here.
project_id = "shortlist"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
# Users must confirm their email before they can sign in.
enable_confirmations = true
